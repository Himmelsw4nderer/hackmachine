# Pinned apps: shown on the taskbar AND on the desktop "APPS // PINNED" card, in this order.
# A pinned app that is not installed is replaced by the first installed [fill] app below.
#
#   label | hue | desktop file ids to try (first one installed wins: native, flatpak, snap …)
#
# hue = the Hackmachine category colour: pink media/games · coral security · peach time/transfer
#       butter files · mint dev · teal chat · sky web · lavender system · lilac session

terminal | lavender | org.kde.konsole
files    | butter   | org.kde.dolphin
brave    | sky      | brave-browser com.brave.Browser
settings | lavender | systemsettings
steam    | pink     | steam com.valvesoftware.Steam
discord  | teal     | discord com.discordapp.Discord vesktop dev.vencord.Vesktop

