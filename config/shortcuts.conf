# Hackmachine shortcuts — one source for the key bindings AND the wallpaper cheat-sheet.
#
#   group | keys | label | command
#
# A row WITH a command is bound by apply.sh (a global shortcut that runs the command).
# A row WITHOUT a command is a Plasma default; it is only shown on the wallpaper.
# A command "kwin:Action[,Action…]" binds KWin's own actions (the Krohnkite tiling ones). With several
# actions the keys split up: Meta+←↑→↓ is Left,Up,Right,Down and Meta+Ctrl+H/L is H,L.
# Keys use KDE notation: Meta+Shift+Return, Ctrl+Alt+T, Print …
# Groups (and their colour on the wallpaper):
#   apps=mint, session=lilac, windows=sky, tiling=teal, desktop=lavender, tools=peach

apps    | Meta+Return       | terminal          | konsole --profile Hackmachine
apps    | Meta+Space        | hack menu         | hm-menu
apps    | Meta+E            | files             |
apps    | Meta+B            | browser           | xdg-open about:blank
apps    | Meta+Shift+Return | btop              | konsole --profile Hackmachine -e btop
apps    | Meta+Alt+V        | cava              | konsole --profile Hackmachine -e cava
apps    | Meta+/            | show all keys     | hm-keys --window
apps    | Meta              | app launcher      |
apps    | Alt+Space         | krunner           |
apps    | Ctrl+Alt+T        | konsole (default) |
apps    | Meta+I            | settings          |
apps    | Meta+Esc          | system monitor    |

session | Meta+L            | lock              |
session | Ctrl+Alt+Del      | log out           |
session | Meta+Q            | activities        |

windows | Meta+←↑→↓         | focus window      | kwin:KrohnkiteFocusLeft,KrohnkiteFocusUp,KrohnkiteFocusRight,KrohnkiteFocusDown
windows | Meta+Alt+←↑→↓     | move window       | kwin:KrohnkiteShiftLeft,KrohnkiteShiftUp,KrohnkiteShiftRight,KrohnkiteShiftDown
windows | Meta+Ctrl+H/L     | narrower / wider  | kwin:KrohnkiteShrinkWidth,KrohnkitegrowWidth
windows | Meta+Ctrl+J/K     | taller / shorter  | kwin:KrohnkiteGrowHeight,KrohnkiteShrinkHeight
windows | Meta+Shift+←→     | to other screen   |
windows | Alt+Tab           | switch window     |
windows | Meta+PgUp         | maximise          |
windows | Alt+F4            | close             |
windows | Meta+Ctrl+Esc     | kill window       |

tiling  | Meta+F            | float / tile      | kwin:KrohnkiteToggleFloat
tiling  | Meta+Shift+F      | float all         | kwin:KrohnkiteFloatAll
tiling  | Meta+Ctrl+Return  | make master       | kwin:KrohnkiteSetMaster
tiling  | Meta+[/]          | fewer/more master | kwin:KrohnkiteDecrease,KrohnkiteIncrease
tiling  | Meta+T            | tile layout       | kwin:KrohnkiteTileLayout
tiling  | Meta+M            | monocle layout    | kwin:KrohnkiteMonocleLayout
tiling  | Meta+\             | next layout       | kwin:KrohnkiteNextLayout
tiling  | Meta+R            | rotate layout     | kwin:KrohnkiteRotate

# Plasma defaults the keys above replace: unbound by apply.sh, given back by uninstall.sh.
!free | Window Quick Tile Left, Window Quick Tile Right, Window Quick Tile Top, Window Quick Tile Bottom, Switch Window Left, Switch Window Right, Switch Window Up, Switch Window Down, Edit Tiles

desktop | Meta+W            | overview          |
desktop | Meta+G            | grid view         |
desktop | Meta+D            | peek desktop      |
desktop | Meta+Ctrl+←→      | switch desktop    |
desktop | Meta+1…9          | taskbar app N     |

tools   | Meta+V            | clipboard         |
tools   | Meta+Shift+S      | screenshot area   |
tools   | Print             | screenshot        |
tools   | Meta+.            | emoji picker      |
