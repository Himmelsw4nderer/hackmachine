# Nook shortcuts — one source for the key bindings AND the wallpaper cheat-sheet.
#
#   group | keys | label | command
#
# A row WITH a command is bound by apply.sh (a global shortcut that runs the command).
# A row WITHOUT a command is a Plasma (or Krohnkite) default; it is only shown on the wallpaper.
# A command "kwin:Action[,Action…]" rebinds KWin's own actions; with several actions the last
# part of the keys has one key per action (Meta+←↑→↓ = Left, Up, Right, Down).
# Keys use KDE notation: Meta+Shift+Return, Ctrl+Alt+T, Print …
# Groups (and their colour on the wallpaper): apps=mint, session=lilac, windows=sky, desktop=lavender, tools=peach

apps    | Meta+Return       | terminal          | alacritty
apps    | Meta+E            | files             |
apps    | Meta+B            | browser           | xdg-open about:blank
apps    | Meta+Shift+Return | btop              | alacritty -e btop
apps    | Meta+Alt+V        | cava              | alacritty -e cava
apps    | Meta+/            | show all keys     | nook-keys --window
apps    | Meta              | app launcher      |
apps    | Alt+Space         | krunner           |
apps    | Ctrl+Alt+T        | konsole fallback  |
apps    | Meta+I            | settings          |
apps    | Meta+Esc          | system monitor    |

session | Meta+L            | lock              |
session | Ctrl+Alt+Del      | log out           |
session | Meta+Q            | activities        |

windows | Meta+←↑→↓         | focus window      | kwin:NookFocusLeft,NookFocusUp,NookFocusRight,NookFocusDown
windows | Meta+Alt+←↑→↓     | move window       | kwin:NookMoveLeft,NookMoveUp,NookMoveRight,NookMoveDown
windows | Meta+Ctrl+Return  | make master       | kwin:KrohnkiteSetMaster
windows | Meta+Shift+←↑→↓   | shrink / grow     | kwin:KrohnkiteShrinkWidth,KrohnkiteShrinkHeight,KrohnkitegrowWidth,KrohnkiteGrowHeight
windows | Meta+F            | float / tile      |
windows | Meta+T            | tile layout       | kwin:KrohnkiteTileLayout
windows | Meta+M            | monocle layout    |
windows | Meta+Shift+Space  | next layout       | kwin:KrohnkiteNextLayout
windows | Meta+Ctrl+Space   | rotate layout     | kwin:KrohnkiteRotate
windows | Alt+Tab           | switch window     |
windows | Meta+PgUp         | maximise          |
windows | Meta+PgDown       | minimise          |
windows | Alt+F4            | close             |
windows | Meta+Ctrl+Esc     | kill window       |

desktop | Meta+W            | overview          |
desktop | Meta+G            | grid view         |
desktop | Meta+D            | peek desktop      |
desktop | Meta+Ctrl+←→      | switch desktop    |
desktop | Meta+1…9          | taskbar app N     |

tools   | Meta+V            | clipboard         |
tools   | Meta+Shift+S      | screenshot area   |
tools   | Print             | screenshot        |
tools   | Meta+.            | emoji picker      |
