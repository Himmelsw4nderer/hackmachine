# Nook for Alacritty: the same pastel 16-colour palette as the Konsole scheme.
# Imported by the alacritty.toml apply.sh writes (that one sets the font and the shell).

[env]
NOOK = "1"

[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
opacity = 0.92
blur = true

[scrolling]
history = 10000

[cursor]
style = { shape = "Block" }

[colors.primary]
background = "#1a1614"
foreground = "#f6ece4"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#1a1614"
cursor = "#c4b2f5"

[colors.selection]
text = "CellForeground"
background = "#4a3f38"

[colors.normal]
black = "#372f2a"
red = "#f7a59a"
green = "#a6e6bf"
yellow = "#f2e29b"
blue = "#a3cdf5"
magenta = "#f5a8c9"
cyan = "#94dcd6"
white = "#bfae9f"

[colors.bright]
black = "#7d6d62"
red = "#ffc2b9"
green = "#c6f6d8"
yellow = "#fff2bd"
blue = "#c4e1ff"
magenta = "#e2b5f0"
cyan = "#b7f1ec"
white = "#f6ece4"
