<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Hackmachine start button: the hexagon-λ filled in, so the launcher reads as a button and not
       as one more app. The banner's rainbow (every app icon is a single pastel), the λ in cocoa. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5a8c9"/>
      <stop offset="0.25" stop-color="#f9c49a"/>
      <stop offset="0.5" stop-color="#a6e6bf"/>
      <stop offset="0.75" stop-color="#a3cdf5"/>
      <stop offset="1" stop-color="#c4b2f5"/>
    </linearGradient>
  </defs>
  <path d="M32 3.5 L56.5 17.6 V46.4 L32 60.5 L7.5 46.4 V17.6 Z" fill="url(#g)" stroke="url(#g)" stroke-width="3" stroke-linejoin="round"/>
  <g fill="none" stroke="#221d1a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23.5 19.5 h3.5 L41.5 45"/>
    <path d="M33 31.5 L23.5 45"/>
  </g>
</svg>
